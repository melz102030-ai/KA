name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared core
        run: npm run core:build

      - name: Unit tests
        run: npm run test -w @akbadna/core

      - name: Lint
        run: npm run lint

      - name: Typecheck (core + mobile)
        run: |
          npm run typecheck
          npm run typecheck -w @akbadna/mobile

      - name: Build Cloud Functions
        run: npm run build -w @akbadna/functions

      - name: Build web app
        run: npm run build -w @akbadna/web
