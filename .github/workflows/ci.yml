name: الفحص المستمر

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: البناء والاختبارات
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4
      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت الحزم
        run: npm ci
      - name: بناء الحزمة الأساسية المشتركة
        run: npm run core:build
      - name: اختبارات الوحدة
        run: npm run test -w @akbadna/core
      - name: فحص جودة الكود
        run: npm run lint
      - name: فحص الأنواع
        run: |
          npm run typecheck
          npm run typecheck -w @akbadna/mobile
      - name: بناء دوال السحابة
        run: npm run build -w @akbadna/functions
      - name: بناء تطبيق الويب (النموذج المرجعي)
        run: npm run build -w @akbadna/web
      - name: تصدير نسخة الويب من الموبايل (البناء المنشور)
        run: npm run export:web -w @akbadna/mobile

  rules:
    name: قواعد أمان Firestore
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4
      - name: تهيئة Node.js
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: تهيئة Java
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: اختبارات قواعد Firestore
        working-directory: services/rules-tests
        run: |
          npm install
          npm test
